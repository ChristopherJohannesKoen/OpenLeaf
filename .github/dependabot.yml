# Dependabot: a pull request when a dependency has a security fix, or a new minor or patch version.
# Major versions (React 19, a new Node line, a new pdf.js) change behaviour and are taken on
# deliberately, by hand, so they are not proposed here. Security fixes are proposed whatever the version.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      api:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # The image stays on the Node 22 line the service is written for.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
