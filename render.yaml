# Render Blueprint: recreates the whole of OpenLeaf (database, API and the web front end) in one go.
# Dashboard -> New -> Blueprint -> pick this repository.
#
# The API and the site are two services on two addresses, and each has to know the other's:
#   * the site is built with VITE_API_URL = the API's address;
#   * the API lets only the site call it from a browser (CORS_ORIGINS = the site's address).
# Render adds a few letters to a name that is already taken (openleaf -> openleaf-cw3y),
# so after the first deploy check both addresses below against the dashboard.
#
# Plans: `free` works but has limits worth knowing about —
#   * the free database is deleted 30 days after creation unless upgraded;
#   * the free web service sleeps after 15 idle minutes and has 0.1 CPU / 512 MB.
# Change the two `plan:` lines to upgrade.

databases:
  - name: openleaf-db
    plan: free
    region: frankfurt
    databaseName: openleaf
    user: openleaf

services:
  - type: web
    name: openleaf-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    # A change to the front end alone does not rebuild the API image.
    buildFilter:
      ignoredPaths:
        - web/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: openleaf-db
          property: connectionString
      # Whoever knows this code can create an account. Read it in the dashboard after the first deploy.
      - key: INVITE_CODE
        generateValue: true
      # Change to `closed` once your own account exists; back to `invite` to add someone.
      - key: REGISTRATION
        value: invite
      - key: DEFAULT_ENGINE
        value: pdflatex
      # The free plan's CPU is slow; allow compiles a generous time limit.
      - key: COMPILE_TIMEOUT_MS
        value: "240000"
      # Sign-in with Google through Firebase Authentication; OpenLeaf then keeps no password.
      # Remove these three for OpenLeaf's own email-and-password sign-in. The project id and
      # the web API key come from the Firebase project's web app settings; neither is a secret.
      - key: AUTH_PROVIDER
        value: firebase
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      # Saving projects to GitHub: the client id of a GitHub OAuth app with device flow enabled,
      # and a key that encrypts the stored tokens.
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: SECRETS_KEY
        generateValue: true
      # Render's edge adds proxies in front of the service; see TRUST_PROXY in .env.example.
      - key: TRUST_PROXY
        sync: false
      # Which web pages may call the API from a browser: the front end below.
      - key: CORS_ORIGINS
        value: https://openleaf-cw3y.onrender.com

  # The front end: a static site built from web/. Free, always on, never sleeps.
  - type: web
    name: openleaf
    runtime: static
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: web/dist
    autoDeploy: true
    buildFilter:
      paths:
        - web/**
    headers:
      # The page's own Content-Security-Policy is built into index.html; these are the parts
      # that only a response header can say.
      - path: /*
        name: Content-Security-Policy
        value: frame-ancestors 'none'
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      # Built files carry a hash of their content in their name, so they can be kept for good.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_URL
        value: https://openleaf-api.onrender.com
      - key: NODE_VERSION
        value: "22"
